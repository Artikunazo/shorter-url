<p-card styleClass="w-full">
	<form [formGroup]="formUrl" class="flex flex-col sm:flex-row gap-4 items-center">
		<div class="flex-1 w-full">
			<input pInputText formControlName="url" type="url" placeholder="https://example.com" class="w-full" />
		</div>
		<p-button
			label="Shorten URL"
			(onClick)="shortUrl()"
			[disabled]="formUrl.invalid"
			styleClass="w-full sm:w-auto p-3"
		></p-button>
	</form>
</p-card>
