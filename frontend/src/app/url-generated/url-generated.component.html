<p-card styleClass="w-full text-center">
	<div class="flex flex-row items-center justify-center gap-4">
		<p class="text-xl font-medium m-0">{{ urlData().shortedUrl }}</p>
		<p-divider layout="vertical"></p-divider>
		<p-button 
			icon="pi pi-copy" 
			[clipboard]="urlData().shortedUrl" 
			[rounded]="true" 
			[text]="true"
			ariaLabel="Copy to clipboard"
			styleClass="py-2 px-3"
		></p-button>
	</div>
</p-card>
